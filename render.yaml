services:
  - type: web
    name: mailsync
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: POLL_INTERVAL_SECONDS
        value: 120
      - key: DB_PATH
        value: ./data/mailcal.db
